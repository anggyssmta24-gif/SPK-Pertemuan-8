<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil Prediksi</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(to right,#f6f0ff,#ede0ff);
    margin:0;
    padding:0;
}

.container{
    width:500px;
    margin:80px auto;
}

.card{
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h1{
    color:#6f42c1;
    margin-bottom:20px;
}

.result-box{
    background:#f3e8ff;
    padding:20px;
    border-radius:15px;
    font-size:22px;
    font-weight:bold;
    color:#5a3ea6;
    margin:25px 0;
}

p{
    color:#666;
    font-size:15px;
}

.btn{
    display:block;
    margin-top:15px;
    padding:12px;
    background:#b388eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
}

.btn:hover{
    background:#9b6de3;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">
        <h1>🎯 Hasil Prediksi</h1>

        <p>Tempat PKL yang direkomendasikan untuk kamu adalah:</p>

        <div class="result-box">
            {{ hasil }}
        </div>

        <a href="/prediksi" class="btn">🔄 Coba Lagi</a>
        <a href="/" class="btn">⬅ Kembali ke Dashboard</a>
    </div>
</div>

</body>
</html>
