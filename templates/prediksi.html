<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediksi PKL</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #f6f0ff, #ede0ff);
    margin:0;
    padding:0;
}

.container{
    width: 500px;
    margin: 50px auto;
}

.card{
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    color:#6f42c1;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
    color:#5a4a7a;
}

input, select{
    width:100%;
    padding:12px;
    border:1px solid #d6c2f0;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus, select:focus{
    border-color:#a678ff;
}

.btn{
    width:100%;
    margin-top:22px;
    padding:12px;
    background:#b388eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#9b6de3;
}

.back-btn{
    display:block;
    text-align:center;
    margin-top:15px;
    padding:10px;
    background:#ece2ff;
    color:#6f42c1;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

.back-btn:hover{
    background:#dcc8ff;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#f3e8ff;
    border-left:5px solid #b388eb;
    border-radius:10px;
    color:#4b3f72;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <div class="card">
        <h1>🔮 Prediksi Tempat PKL</h1>

        <form method="POST">

            <label>Jurusan</label>
            <select name="jurusan" required>
                <option value="">-- Pilih Jurusan --</option>
                <option value="Teknik Komputer dan Jaringan">Teknik Komputer dan Jaringan</option>
                <option value="Desain Komunikasi Visual">Desain Komunikasi Visual</option>
                <option value="Teknik Sepeda Motor">Teknik Sepeda Motor</option>
                <option value="Keperawatan">Keperawatan</option>
                <option value="Farmasi">Farmasi</option>
                <option value="Perhotelan">Perhotelan</option>
            </select>

            <label>Jarak</label>
            <select name="jarak" required>
                <option value="Dekat">Dekat</option>
                <option value="Sedang">Sedang</option>
                <option value="Jauh">Jauh</option>
            </select>

            <label>Fasilitas</label>
            <select name="fasilitas" required>
                <option value="Lengkap">Lengkap</option>
                <option value="Cukup">Cukup</option>
                <option value="Kurang">Kurang</option>
            </select>

            <label>Reputasi</label>
            <select name="reputasi" required>
                <option value="Sangat Baik">Sangat Baik</option>
                <option value="Baik">Baik</option>
                <option value="Cukup">Cukup</option>
            </select>

            <button type="submit" class="btn">Prediksi Sekarang</button>
        </form>

        {% if hasil %}
        <div class="result">
            🎯 Rekomendasi Tempat PKL: {{ hasil }}
        </div>
        {% endif %}

        <a href="/" class="back-btn">⬅ Kembali ke Dashboard</a>

    </div>
</div>

</body>
</html>
